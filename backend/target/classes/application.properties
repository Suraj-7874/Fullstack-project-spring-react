# Server
server.port=8080

# API base is set in controller paths (no servlet path prefix)

# Datasource (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/newprojectdb
spring.datasource.username=root
spring.datasource.password=root@7874
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT
app.jwt.secret=${JWT_SECRET:change-this-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Swagger UI path
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


